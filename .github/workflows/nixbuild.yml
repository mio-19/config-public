name: nixbuild

# https://github.com/nixbuild/nixbuild-action
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [fw13, husky, ipc, macvirt, deck]
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: mio-19/maximize-build-space@751b517c9f4fa92ff0da312d413d6abf01ff5ed3 # patch-1
        with:
          root-reserve-mb: 1024
          swap-size-mb: 18000
          overprovision-lvm: 'true'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: /nix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: '2.31.5'
          nix_conf: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mio.cachix.org-1:FlupyyLPURqwdRqtPT/LBWKsXY7JKsDkzZQo2K6LeMM= mio-cache.cachix.org-1:ouuIJZ59HIflYjpLW6DRyMc1c+6r3kC/LHuqGUsWigg= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= staging.cachix.org-1:WX63nyFdVdWGn6n59pIYwkcH/AtjJGjvMQFKlI2z00w= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= mio-config.cachix.org-1:VM6OZi+PC/ENBDf5ogaArQMgVUvJNvAL5t9ayXZdCIg=
            substituters = https://cache.nixos.org/ https://mio.cachix.org/ https://mio-cache.cachix.org/ https://nix-community.cachix.org/ https://staging.cachix.org/ https://cache.numtide.com https://mio-config.cachix.org
      - uses: nixbuild/nixbuild-action@dea5d365a01d55dc038487801216ea5983c8b9c8 # v26
        with:
          nixbuild_token: ${{ secrets.nixbuild_token }}
      - uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13 # v17
        with:
          name: mio-config
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build NixOS configuration
        continue-on-error: true
        run: |
          timeout --signal=KILL 3h nix build ./nixos#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --keep-going
      - name: Update flake and rebuild NixOS configuration
        continue-on-error: true
        run: |
          cd nixos
          nix flake update
          cd ..
          timeout --signal=KILL 1h nix build ./nixos#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --keep-going